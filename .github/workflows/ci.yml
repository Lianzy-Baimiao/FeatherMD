name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo clippy --all-targets --locked --features store -- -D warnings
      - run: cargo test --locked --features store
      - run: python -m unittest discover -s packaging -p "test_*.py"
      - run: cargo build --release --locked
      - name: Build stand-ins for the edit and update smoke tests
        if: runner.os == 'Windows'
        run: cargo build --release --locked --example editor_probe --example update_server
      - name: Native Windows smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/ui-smoke.ps1
          ./scripts/navigation-smoke.ps1
          ./scripts/navigation-smoke.ps1 -Shape wrapped -Output ./test-artifacts/navigation-wrapped
          ./scripts/scrollbar-smoke.ps1
          ./scripts/window-smoke.ps1
          ./scripts/typography-smoke.ps1
          ./scripts/typography-smoke.ps1 -Theme dark -Output ./test-artifacts/typography-dark
          ./scripts/about-smoke.ps1
          ./scripts/about-smoke.ps1 -Theme dark -Output ./test-artifacts/about-dark
          ./scripts/settings-smoke.ps1
          ./scripts/settings-smoke.ps1 -Theme dark -Output ./test-artifacts/settings-dark
          ./scripts/editor-smoke.ps1 -AllowNoPopup
          ./scripts/update-smoke.ps1 -AllowNoPopup
          ./scripts/update-smoke.ps1 -Theme dark -Output ./test-artifacts/update-dark -AllowNoPopup
          ./scripts/table-smoke.ps1
          ./scripts/table-smoke.ps1 -Theme dark -Output ./test-artifacts/table-dark
          ./scripts/image-smoke.ps1
          ./scripts/image-smoke.ps1 -Theme dark -Output ./test-artifacts/image-dark
          ./scripts/i18n-smoke.ps1
      # Keep the captures when a smoke fails; they show what went wrong.
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: FeatherMD-windows-x64
          path: |
            target/release/feathermd.exe
            test-artifacts/*.png
            test-artifacts/ui-smoke.json
            test-artifacts/navigation*/navigation.json
            test-artifacts/scrollbar/scrollbar.json
            test-artifacts/window/*.png
            test-artifacts/window/window.json
            test-artifacts/about*/*.png
            test-artifacts/about*/about.json
            test-artifacts/typography*/*.png
            test-artifacts/typography*/typography.json
            test-artifacts/settings*/*.png
            test-artifacts/settings*/settings.json
            test-artifacts/editor/editor.json
            test-artifacts/update*/*.png
            test-artifacts/update*/update.json
            test-artifacts/table*/*.png
            test-artifacts/table*/table.json
            test-artifacts/image*/*.png
            test-artifacts/image*/image.json
            test-artifacts/i18n/*.png
            test-artifacts/i18n/*.txt
            test-artifacts/i18n/i18n.json
