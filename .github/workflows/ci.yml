name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Native Windows smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/ui-smoke.ps1
          ./scripts/navigation-smoke.ps1
          ./scripts/navigation-smoke.ps1 -Shape wrapped -Output ./test-artifacts/navigation-wrapped
          ./scripts/scrollbar-smoke.ps1
          ./scripts/window-smoke.ps1
          ./scripts/typography-smoke.ps1
          ./scripts/typography-smoke.ps1 -Theme dark -Output ./test-artifacts/typography-dark
          ./scripts/about-smoke.ps1
          ./scripts/about-smoke.ps1 -Theme dark -Output ./test-artifacts/about-dark
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: FeatherMD-windows-x64
          path: |
            target/release/feathermd.exe
            test-artifacts/*.png
            test-artifacts/ui-smoke.json
            test-artifacts/navigation*/navigation.json
            test-artifacts/scrollbar/scrollbar.json
            test-artifacts/window/*.png
            test-artifacts/window/window.json
            test-artifacts/about*/*.png
            test-artifacts/about*/about.json
            test-artifacts/typography*/*.png
            test-artifacts/typography*/typography.json
