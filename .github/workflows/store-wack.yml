name: Supplemental Store WACK
on:
  workflow_dispatch:
    inputs:
      identity_json:
        description: 'Verified FeatherMD identity JSON (public package metadata, not credentials); blank for test identity'
        required: false
        type: string
permissions:
  contents: read
jobs:
  wack:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0
      - run: python -m unittest discover -s packaging -p "test_*.py"
      - run: cargo build --locked --release --features store --target-dir target/store
      - name: Build unsigned candidate
        shell: pwsh
        env:
          STORE_IDENTITY_JSON: ${{ inputs.identity_json }}
        run: |
          $sdk = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/makeappx.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $sdk) { throw 'MakeAppx not installed' }
          $identityArgs = @('--test-identity')
          if ($env:STORE_IDENTITY_JSON) {
            $identity = Join-Path $env:RUNNER_TEMP 'feathermd-identity.json'
            [IO.File]::WriteAllText($identity, $env:STORE_IDENTITY_JSON, [Text.UTF8Encoding]::new($false))
            $identityArgs = @('--identity', $identity)
          }
          python packaging/msix.py --binary target/store/release/feathermd.exe --version 1.0.11.0 @identityArgs --output dist/wack-candidate --makeappx $sdk.FullName
          if ($LASTEXITCODE) { throw 'Packaging failed' }
      - name: Disposable supplemental WACK
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -LiteralPath dist/wack-candidate -Filter '*.msix')
          if ($packages.Count -ne 1) { throw 'Expected one candidate' }
          ./packaging/test_wack.ps1 -Package $packages[0].FullName -PackageReport dist/wack-candidate/package-report.json -Output "$env:RUNNER_TEMP/feathermd-wack"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FeatherMD-wack-reports
          path: |
            ${{ runner.temp }}/feathermd-wack/
            dist/wack-candidate/package-report.json
            dist/wack-candidate/*.msix
            dist/wack-candidate/SHA256SUMS.txt
