[package]
name = "feathermd"
version = "0.1.13"
authors = ["lianzy"]
edition = "2024"
rust-version = "1.88"
description = "A tiny native Windows Markdown reader with bounded, on-demand file access"
license = "MIT"
repository = "https://github.com/Lianzy-Baimiao/FeatherMD"

[features]
store = []

[dependencies]
memchr = "2.7"
pulldown-cmark = { version = "0.13", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_Packaging_Appx", "Win32_System_Threading", "Win32_System_IO", "Win32_Security", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_UI_Input_KeyboardAndMouse", "Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Com", "Win32_Networking_WinHttp", "Win32_Globalization"] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
